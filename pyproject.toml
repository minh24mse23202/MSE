[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aragbiz"
version = "0.1.0"
description = "Adaptive RAG system for business workflow question answering"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "alembic>=1.13,<2",
]
app = ["streamlit>=1.32", "requests>=2.31"]
ml = ["datasets>=2.18,<5", "transformers>=4.40,<5", "accelerate>=0.28,<2", "scikit-learn>=1.4,<2", "torch>=2.2,<2.6"]
models = ["litellm>=1.70,<2"]
eval = ["ragas>=0.1.7"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
