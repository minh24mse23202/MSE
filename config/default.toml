[paths]
sample_dataset = "data/processed/wixqa_expertwritten_qac.jsonl"
fallback_sample_dataset = "data/sample/business_workflows.jsonl"
kb_corpus = "data/processed/wix_kb_corpus_documents.jsonl"
feedback_store = "feedback.jsonl"

[wixqa]
dataset_name = "Wix/WixQA"
qa_subset = "wixqa_expertwritten"
kb_subset = "wix_kb_corpus"
revision = "main"

[classifier]
simple_top_k = 2
moderate_top_k = 4
complex_top_k = 6
model_path = "data/artifacts/query_classifier_distilbert"
t5_model_path = "data/artifacts/query_classifier_t5"
fallback_model_path = "data/artifacts/query_classifier_nb.json"
use_trained_model = true

[retrieval]
default_mode = "hybrid"
bm25_weight = 0.65
dense_weight = 0.35

[generator]
max_context_chars = 900

[pipeline]
max_subqueries = 4

[knowledge]
backend = "postgres"
database_url = "postgresql+psycopg://aragbiz:aragbiz@localhost:5432/aragbiz"
json_store = "data/knowledge/knowledge_store.json"
embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
embedding_dimension = 384
use_sentence_transformers = false
chunk_size = 800
chunk_overlap = 120

[model_farm]
json_store = "data/knowledge/model_farm_store.json"
global_monthly_budget_usd = 0
# Set ARAGBIZ_MODEL_SECRET_KEY in the environment before storing provider credentials.
secret_key = ""

[auth]
json_store = "data/knowledge/auth_store.json"
required = false
access_token_ttl_seconds = 28800

[chat]
json_store = "data/knowledge/chat_store.json"
history_default_exchanges = 3
history_default_characters = 4000

[jobs]
json_store = "data/knowledge/jobs_store.json"
blob_store = "data/uploads"
lease_seconds = 120

[evaluation]
json_store = "data/knowledge/evaluation_store.json"

[ragxplain]
root = "../ragxplain"
results_root = "docs/evaluation/results"
judge = "examples.mock_judge_impl:judge"
timeout_seconds = 1800
